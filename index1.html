<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>m00n5ky :: CYBER ACCESS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #02020a; user-select: none; -webkit-user-select: none; }

  #scene { position: fixed; inset: 0; display: block; z-index: 1; }

  /* ============ OVERLAY CONTENT ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }

  .chip {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; letter-spacing: .35em; color: #7df9ff;
    border: 1px solid rgba(0,255,255,.35);
    background: rgba(0,255,255,.05);
    padding: 7px 18px 7px 22px;
    margin-bottom: 34px;
    box-shadow: 0 0 22px rgba(0,255,255,.12) inset, 0 0 14px rgba(0,255,255,.08);
    animation: chipPulse 2.4s ease-in-out infinite;
    text-transform: uppercase;
  }
  @keyframes chipPulse {
    0%, 100% { box-shadow: 0 0 22px rgba(0,255,255,.12) inset, 0 0 14px rgba(0,255,255,.08); }
    50%      { box-shadow: 0 0 30px rgba(0,255,255,.28) inset, 0 0 24px rgba(0,255,255,.18); }
  }

  .glitch {
    position: relative;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 7.5vw, 5.8rem);
    letter-spacing: .18em;
    line-height: 1.05;
    color: #eaffff;
    text-shadow: 0 0 8px rgba(0,255,255,.9), 0 0 28px rgba(0,255,255,.55), 0 0 70px rgba(0,255,255,.35);
    animation: titleFlicker 7s infinite;
  }
  .glitch.moon {
    color: #ff9df5;
    text-shadow: 0 0 8px rgba(255,0,255,.95), 0 0 28px rgba(255,0,255,.6), 0 0 70px rgba(255,0,255,.4);
    animation: titleFlicker 5.3s infinite reverse;
  }
  .glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute; inset: 0; opacity: 0;
    pointer-events: none;
  }
  .glitch::before { color: #ff00ff; animation: glitchA 3.6s infinite steps(1); }
  .glitch::after  { color: #00ffff; animation: glitchB 4.4s infinite steps(1); }

  @keyframes titleFlicker {
    0%, 89%, 91%, 93%, 100% { opacity: 1; }
    90% { opacity: .55; }
    92% { opacity: .85; }
  }
  @keyframes glitchA {
    0%, 90%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
    91% { opacity: .9; transform: translate(-5px,-2px); clip-path: inset(8% 0 58% 0); }
    92% { opacity: .9; transform: translate(4px,1px);  clip-path: inset(62% 0 4% 0); }
    93% { opacity: .7; transform: translate(-6px,3px); clip-path: inset(28% 0 34% 0); }
    94% { opacity: .9; transform: translate(3px,-1px); clip-path: inset(4% 0 82% 0); }
    95% { opacity: .5; transform: translate(-4px,4px); clip-path: inset(72% 0 12% 0); }
    96% { opacity: .9; transform: translate(5px,2px);  clip-path: inset(40% 0 46% 0); }
    97% { opacity: .4; transform: translate(-3px,1px); clip-path: inset(18% 0 60% 0); }
  }
  @keyframes glitchB {
    0%, 88%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
    89% { opacity: .9; transform: translate(5px,2px);  clip-path: inset(55% 0 10% 0); }
    90% { opacity: .8; transform: translate(-4px,-1px); clip-path: inset(12% 0 70% 0); }
    91% { opacity: .9; transform: translate(6px,3px);  clip-path: inset(75% 0 6% 0); }
    92% { opacity: .6; transform: translate(-5px,2px); clip-path: inset(35% 0 40% 0); }
    93% { opacity: .9; transform: translate(4px,-2px); clip-path: inset(5% 0 88% 0); }
    94% { opacity: .5; transform: translate(-6px,3px); clip-path: inset(60% 0 22% 0); }
    95% { opacity: .9; transform: translate(3px,1px);  clip-path: inset(45% 0 38% 0); }
  }

  .typed-wrap {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(12px, 1.6vw, 16px);
    letter-spacing: .22em;
    color: #7df9ff;
    margin-top: 30px;
    min-height: 22px;
    text-shadow: 0 0 10px rgba(0,255,255,.6);
  }
  .cursor { color: #00ffff; animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ CRT / SCANLINES / VIGNETTE ============ */
  .scanlines {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
  }
  .scanbar {
    position: fixed; left: 0; right: 0; height: 90px; z-index: 21; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(0,255,255,.05), transparent);
    animation: scanMove 6s linear infinite;
  }
  @keyframes scanMove {
    0% { top: -15%; } 100% { top: 115%; }
  }
  .vignette {
    position: fixed; inset: 0; z-index: 22; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(2,2,15,.75) 100%);
  }

  /* ============ HUD ============ */
  .hud {
    position: fixed; inset: 0; z-index: 15; pointer-events: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: .25em; color: #5ff4ff;
    text-shadow: 0 0 8px rgba(0,255,255,.5);
  }
  .hud > div { position: absolute; padding: 14px 18px; }
  .hud .tl { top: 0; left: 0; border-top: 1px solid rgba(0,255,255,.45); border-left: 1px solid rgba(0,255,255,.45); }
  .hud .tr { top: 0; right: 0; text-align: right; border-top: 1px solid rgba(0,255,255,.45); border-right: 1px solid rgba(0,255,255,.45); }
  .hud .bl { bottom: 0; left: 0; border-bottom: 1px solid rgba(0,255,255,.45); border-left: 1px solid rgba(0,255,255,.45); }
  .hud .br { bottom: 0; right: 0; text-align: right; border-bottom: 1px solid rgba(0,255,255,.45); border-right: 1px solid rgba(0,255,255,.45); }
  .hud .dim { color: rgba(95,244,255,.45); }
  .hud .pink { color: #ff5df1; text-shadow: 0 0 8px rgba(255,0,255,.55); }

  .corner { position: fixed; width: 26px; height: 26px; z-index: 16; pointer-events: none; }
  .corner.c1 { top: 16px; left: 16px; border-top: 2px solid rgba(0,255,255,.8); border-left: 2px solid rgba(0,255,255,.8); }
  .corner.c2 { top: 16px; right: 16px; border-top: 2px solid rgba(0,255,255,.8); border-right: 2px solid rgba(0,255,255,.8); }
  .corner.c3 { bottom: 16px; left: 16px; border-bottom: 2px solid rgba(0,255,255,.8); border-left: 2px solid rgba(0,255,255,.8); }
  .corner.c4 { bottom: 16px; right: 16px; border-bottom: 2px solid rgba(0,255,255,.8); border-right: 2px solid rgba(0,255,255,.8); }

  .signalbars span { display: inline-block; width: 6px; background: #5ff4ff; margin-right: 2px; box-shadow: 0 0 6px rgba(0,255,255,.7); }
  .signalbars span:nth-child(1) { height: 5px; }
  .signalbars span:nth-child(2) { height: 8px; }
  .signalbars span:nth-child(3) { height: 11px; }
  .signalbars span:nth-child(4) { height: 14px; animation: sig 1.2s steps(1) infinite; }
  .signalbars span:nth-child(5) { height: 14px; animation: sig .8s steps(1) infinite; }
  @keyframes sig { 50% { background: #1a4a52; box-shadow: none; } }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>

<div class="overlay">
  <div class="chip">◤ SYSTEM v2.0.77 — NODE: m00n5ky ◢</div>
  <h1 class="glitch" data-text="WELCOME">WELCOME</h1>
  <h1 class="glitch moon" data-text="m00n5ky">m00n5ky</h1>
  <p class="typed-wrap"><span id="typer"></span><span class="cursor">█</span></p>
</div>

<div class="hud">
  <div class="tl">NODE: m00n5ky<br /><span class="dim">SYS.MOON-5K // v2.0.77</span></div>
  <div class="tr" id="hudClock"><span class="pink">LOCAL TIME</span><br />--:--:--</div>
  <div class="bl">
    SIGNAL <span class="signalbars"><span></span><span></span><span></span><span></span><span></span></span><br />
    <span class="dim">ENCRYPTION: AES-256 ▮▮▮▮▮</span>
  </div>
  <div class="br" id="hudCoord"><span class="pink">COORD</span><br /><span id="coord">0.000 // 0.000</span></div>
</div>

<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
<div class="scanlines"></div>
<div class="scanbar"></div>
<div class="vignette"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ---------- Renderer & Scene ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030310);
scene.fog = new THREE.FogExp2(0x030310, 0.028);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1.1, 13);

/* ---------- 3D Objects ---------- */
// Core: neon icosahedron
const ico = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.9, 1),
  new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.95 })
);
scene.add(ico);

// Inner shell (counter-rotating, magenta)
const icoInner = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.15, 1),
  new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true, transparent: true, opacity: 0.6 })
);
ico.add(icoInner);

// Torus rings
const ring1 = new THREE.Mesh(
  new THREE.TorusGeometry(3.15, 0.045, 16, 140),
  new THREE.MeshBasicMaterial({ color: 0x00ffff })
);
ring1.rotation.x = Math.PI / 2.2;
scene.add(ring1);

const ring2 = new THREE.Mesh(
  new THREE.TorusGeometry(3.85, 0.028, 16, 140),
  new THREE.MeshBasicMaterial({ color: 0xff00ff })
);
ring2.rotation.x = Math.PI / 1.75;
ring2.rotation.y = 0.45;
scene.add(ring2);

// Neon grid floor
const grid = new THREE.GridHelper(140, 90, 0x00e0ff, 0x0e2540);
grid.position.y = -3;
scene.add(grid);

// Star particle field
const STAR_COUNT = 900;
const starPos = new Float32Array(STAR_COUNT * 3);
const starCol = new Float32Array(STAR_COUNT * 3);
const palette = [
  new THREE.Color(0x00ffff), new THREE.Color(0xff00ff),
  new THREE.Color(0xffffff), new THREE.Color(0x4d9fff)
];
for (let i = 0; i < STAR_COUNT; i++) {
  const r = 14 + Math.random() * 26;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  starPos[i*3+2] = r * Math.cos(phi);
  const c = palette[Math.floor(Math.random() * palette.length)];
  starCol[i*3] = c.r; starCol[i*3+1] = c.g; starCol[i*3+2] = c.b;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  size: 0.06, vertexColors: true, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(stars);

/* ---------- Bloom (neon glow) ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.15, 0.55, 0.12);
composer.addPass(bloomPass);

/* ---------- Interaction: parallax + click bursts ---------- */
let mx = 0, my = 0, tx = 0, ty = 0;
window.addEventListener('pointermove', e => {
  mx = (e.clientX / window.innerWidth - 0.5) * 2;
  my = (e.clientY / window.innerHeight - 0.5) * 2;
});

const bursts = [];
window.addEventListener('pointerdown', () => {
  const color = Math.random() > 0.5 ? 0x00ffff : 0xff00ff;
  const b = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.45, 0),
    new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true })
  );
  b.position.set((Math.random() - 0.5) * 7, (Math.random() - 0.5) * 4, -1);
  scene.add(b);
  bursts.push({ mesh: b, life: 1 });
});

/* ---------- HUD: clock, coords, typing ---------- */
const hudClock = document.getElementById('hudClock');
const coordEl = document.getElementById('coord');
setInterval(() => {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  hudClock.innerHTML = '<span class="pink">LOCAL TIME</span><br />' +
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}, 1000);

const typer = document.getElementById('typer');
const lines = [
  '> establishing uplink ...',
  '> authentication: OK',
  '> selamat datang, m00n5ky',
  '> welcome to the grid _'
];
let li = 0, ci = 0, deleting = false;
setInterval(() => {
  const line = lines[li];
  if (!deleting) {
    ci++;
    typer.textContent = line.slice(0, ci);
    if (ci === line.length) { deleting = true; }
  } else {
    ci--;
    typer.textContent = line.slice(0, ci);
    if (ci === 0) { deleting = false; li = (li + 1) % lines.length; }
  }
}, 45);

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Animate ---------- */
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  ico.rotation.x = t * 0.22;
  ico.rotation.y = t * 0.34;
  icoInner.rotation.x = -t * 0.5;
  icoInner.rotation.y = -t * 0.42;
  ring1.rotation.z = t * 0.28;
  ring2.rotation.z = -t * 0.22;
  stars.rotation.y = t * 0.018;
  stars.rotation.x = Math.sin(t * 0.05) * 0.05;

  // gentle float
  ico.position.y = Math.sin(t * 0.8) * 0.35;

  // smooth parallax + intro zoom
  tx += (mx - tx) * 0.05;
  ty += (my - ty) * 0.05;
  const intro = Math.min(1, t / 2.2);
  camera.position.x = tx * 1.3;
  camera.position.y = 1.1 - ty * 0.9;
  camera.position.z = 13 - intro * 4;
  camera.lookAt(0, 0, 0);

  // click bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.life -= 0.022;
    b.mesh.scale.setScalar(1 + (1 - b.life) * 4);
    b.mesh.rotation.x += 0.04;
    b.mesh.rotation.y += 0.06;
    b.mesh.material.opacity = b.life * 0.85;
    if (b.life <= 0) {
      scene.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
      bursts.splice(i, 1);
    }
  }

  // mouse-based coords HUD
  coordEl.textContent = (tx * 25.734).toFixed(3) + ' // ' + (-ty * 25.734).toFixed(3);

  composer.render();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
